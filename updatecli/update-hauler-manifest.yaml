name: "Update Hauler manifest"

scms:
  source:
    kind: "github"
    spec:
      owner: "{{ .source.owner }}"
      repository: "{{ .source.repository }}"
      branch: "{{ .source.branch }}"
  target:
    kind: "github"
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"
      commitusingapi: true
      submodules: false
      commitmessage:
        hidecredit: true
        footers: "{{ .scm.footer }}"

sources:
  manifest:
    name: "Read the Hauler manifest"
    kind: file
    scmid: source
    spec:
      file: "{{ .source.manifest }}"
  bundle:
    name: "Read the Hauler manifest cosign bundle"
    kind: file
    scmid: source
    spec:
      file: "{{ .source.bundle }}"

targets:
  manifest:
    name: "updates {{ .destination.manifest }} file"
    kind: file
    scmid: target
    sourceid: manifest
    spec:
      file: "{{ .destination.directory }}/{{ .destination.manifest }}"
      forcecreate: true
  bundle:
    name: "updates {{ .destination.bundle }} file"
    kind: file
    scmid: target
    sourceid: bundle
    spec:
      file: "{{ .destination.directory }}/{{ .destination.bundle }}"
      forcecreate: true

actions:
  default:
    kind: "github/pullrequest"
    scmid: "target"
    spec:
      merge:
        strategy: manual
      title: "{{ .pr.title }}"
# {{ if .pr.labels }}
      labels:
# {{ range .pr.labels }}
        - "{{ . }}"
# {{ end }}
# {{ end }}
